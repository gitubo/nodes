<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAG Widget Message Bridge Demo</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="./styles/main.css">
    <style>
        body { display: flex; height: 100vh; overflow: hidden; margin: 0; }

        #canvas-container { flex-grow: 1; position: relative; }

        h3 { margin: 0 0 5px 0; font-size: 14px; color: #333; }
    </style>
</head>
<body>


    <div id="canvas-container"></div>

    <script type="module">
        import { DAGWidget } from './src/Widget.js';

        // 1. Initialize Widget
        const widget = new DAGWidget('#canvas-container');

        // 2. Subscribe to the Event Stream (Outbound)
        widget.subscribe((type, payload) => {
            console.log(type," --> ",JSON.stringify(payload, null, 2));
        });

        // 3. Dispatch Helper (Inbound)
        // Expose to window for the HTML buttons to use
        window.cmd = (command, payload) => {
            console.log(`%c➤ Dispatch: ${command}`, 'color: blue; font-weight: bold;', payload || '');
            widget.dispatch(command, payload);
        };

        console.log("Widget Initialized. Dispatch commands via window.cmd()");
    </script>
</body>
</html>
